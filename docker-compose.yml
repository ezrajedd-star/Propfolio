# Local / single-VM deployment. For production, point DATABASE_URL at a managed Postgres,
# put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in front of `web`,
# and use a real SMTP service instead of Mailpit.
name: propfolio

x-app-env: &app-env
  DATABASE_URL: postgresql://propfolio:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/propfolio
  APP_URL: ${APP_URL:-http://localhost:3000}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
  MAIL_FROM: ${MAIL_FROM:-Propfolio <no-reply@propfolio.local>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: propfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: propfolio
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to your computer, so it can't clash with a Postgres you already run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propfolio -d propfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025" # web UI to read test emails

  migrate:
    build: { context: ., target: worker }
    image: propfolio-worker
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    image: propfolio-web
    environment: *app-env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    image: propfolio-worker
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Demo data for trying Propfolio out: `docker compose run --rm seed`.
  # Synthetic only, and refuses to run twice. Never point it at a real database.
  seed:
    build: { context: ., target: worker }
    image: propfolio-worker
    profiles: ["seed"]
    command: ["node_modules/.bin/tsx", "--tsconfig", "tsconfig.worker.json", "prisma/seed.ts"]
    environment:
      <<: *app-env
      NODE_ENV: development
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

volumes:
  pgdata:
