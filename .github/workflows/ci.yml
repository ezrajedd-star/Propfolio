name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: propfolio
          POSTGRES_PASSWORD: propfolio
          POSTGRES_DB: propfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U propfolio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://propfolio:propfolio@localhost:5432/propfolio
      TEST_DATABASE_URL: postgresql://propfolio:propfolio@localhost:5432/propfolio_test
      E2E_DATABASE_URL: postgresql://propfolio:propfolio@localhost:5432/propfolio_e2e
      MAIL_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          PGPASSWORD=propfolio psql -h localhost -U propfolio -d propfolio -c "CREATE DATABASE propfolio_test" -c "CREATE DATABASE propfolio_e2e"
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
