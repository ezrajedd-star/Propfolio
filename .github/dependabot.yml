# Weekly pull requests for outdated or vulnerable dependencies. Security alerts themselves are
# switched on in GitHub: Settings → Code security → Dependabot alerts / security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Asia/Manila }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
